# A tag `vX.Y.Z` releases X.Y.Z: the two archives are built from the tag, installed from those very
# archives by the oldest and the latest spec-kit the manifests support, and only then attached to a
# GitHub release. The checker needs nothing published: the commands run it from this tag with uvx.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the checker's version comes from the tag
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: The tag is a version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same gates as a pull request, on the tagged tree: a tag is not a way around them.
      - run: uv run --project checker --extra test pytest -q checker
      - run: uv run --no-project python preset/build.py --check

      - run: scripts/package.sh "${{ steps.version.outputs.version }}"

      # The checker at this tag reports this version: what `uvx --from …@vX.Y.Z` will run.
      - name: The checker at this tag is this version
        run: |
          reported="$(uvx --from ./checker speckit-bdd --version)"
          [ "$reported" = "speckit-bdd ${{ steps.version.outputs.version }}" ] || { echo "the checker reports '$reported'" >&2; exit 1; }

      # The archives as a user installs them, by URL, on the floor and the latest spec-kit.
      - name: Install from the archives
        run: |
          (cd dist && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 1
          version="${{ steps.version.outputs.version }}"
          for spec_kit in v0.14.0 v1.0.13; do
            uv tool install --force specify-cli --from "git+https://github.com/github/spec-kit.git@$spec_kit"
            echo "── spec-kit $spec_kit"
            EXTENSION="http://127.0.0.1:8765/speckit-bdd-extension-$version.zip" \
            PRESET="http://127.0.0.1:8765/speckit-bdd-preset-$version.zip" \
              scripts/integration.sh
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/speckit-bdd-extension-$version.zip" \
            "dist/speckit-bdd-preset-$version.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Install in a spec-kit project (0.14.0 or later):

          \`\`\`bash
          specify extension add bdd --from https://github.com/${GITHUB_REPOSITORY}/releases/download/$GITHUB_REF_NAME/speckit-bdd-extension-$version.zip
          specify preset add bdd --from https://github.com/${GITHUB_REPOSITORY}/releases/download/$GITHUB_REF_NAME/speckit-bdd-preset-$version.zip
          \`\`\`"
