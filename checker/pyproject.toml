[project]
name = "speckit-bdd"
# From the git tag (hatch-vcs), so `uvx --from git+…@vX.Y.Z` reports X.Y.Z with nothing stamped.
dynamic = ["version"]
description = "Checks a spec-kit project's Gherkin features against its glossary and its specs: undefined terms, refused synonyms, contradictions, untraced requirements and scenarios written twice."
requires-python = ">=3.11"
dependencies = [
    "gherkin-official>=29",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
speckit-bdd = "speckit_bdd.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# The repository root, one above this package; untagged history reads as a development version.
raw-options = { root = "..", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/speckit_bdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
